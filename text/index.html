<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreakerOps | Message us</title>
<meta name="description" content="Text BreakerOps to get set up. No app - plain text.">
<meta name="theme-color" content="#171717">


<style>
*{box-sizing:border-box}
:root{--bg:#171717;--fg:#e8e8ed;--muted:#9a9aa0;--border:#3a3a3c;--blue:#6b9bff}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 22px}
header{padding:18px 0}
.brand{font-weight:800;letter-spacing:-.02em;font-size:20px;text-decoration:none;color:var(--fg)}
.brand span{font-weight:400;color:var(--blue)}
h1{font-size:clamp(34px,7vw,48px);line-height:1.12;letter-spacing:-.02em;margin:56px 0 12px}
.sub{font-size:22px;color:var(--muted);margin:0 0 34px}
.phone{font:inherit;font-size:24px;width:100%;padding:16px 18px;border:1px solid var(--border);border-radius:10px;background:#1e1e20;color:var(--fg);margin:0 0 16px}
.phone:focus{outline:none;border-color:var(--blue)}
.consent{font-size:15px;color:var(--muted);margin:0 0 28px}
.consent a{color:var(--blue)}
.btn{display:block;width:100%;background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:10px;padding:16px 0;font:inherit;font-size:20px;font-weight:600;cursor:pointer;text-align:center}
.btn .arr{color:var(--blue);font-weight:700}
.btn[disabled]{opacity:.5}
.st{font-size:14px;color:var(--muted);margin:12px 0 0;min-height:20px}
.ok{font-size:20px;font-weight:600;margin:40px 0 0}
.ok .b{color:var(--blue)}
.hp{position:absolute;left:-9999px}
main{flex:1 0 auto}
footer{margin:auto 0 0;font:12px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--muted);padding:18px 0 22px}
footer a{color:var(--blue)}
@media(max-width:480px){h1{font-size:36px;margin-top:44px}.sub{font-size:22px}.wrap{padding:0 26px}}
</style><link rel="icon" href="/assets/img/brand-icon-v2.png" type="image/png" sizes="256x256"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=4" sizes="180x180"><meta property="og:title" content="BreakerOps | Message us"><meta property="og:description" content="A personal assistant for your business. You just text it."><meta property="og:site_name" content="BreakerOps"><meta property="og:type" content="website"><meta property="og:image" content="https://www.breakerops.com/assets/img/social-preview-v2.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="BreakerOps logo"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.breakerops.com/assets/img/social-preview-v2.png"></head><body>
<header><div class="wrap"><a class="brand" href="/">Breaker<span>Ops</span></a></div></header>
<main><div class="wrap">
<h1>Message us.</h1>
<p class="sub">Text Matt to get set up - he will take it from there.</p>
<a id="smslink" class="btn" style="text-decoration:none;opacity:.5">Text us <span class="arr">&gt;</span></a>
<p id="tfnum" class="st" style="margin-top:14px">Our texting number is being set up. This will open your messaging app as soon as it is live.</p>
</div></main>
<footer><div class="wrap">BreakerOps &middot; <a href="mailto:matt@breakerops.com" style="color:var(--muted)">matt@breakerops.com</a><br><a href="/terms/" style="color:var(--muted)">Terms</a> &middot; <a href="/sms-terms/" style="color:var(--muted)">SMS Terms</a> &middot; <a href="/privacy/" style="color:var(--muted)">Privacy</a></div></footer>
<script>
// Customer-first entry: the customer texts Matt first. No number is collected on this page.
// The button stays inert until MATT_NUMBER is set (E.164, e.g. "+16125550123") at go-live.
(function(){
var MATT_NUMBER="";
if(!MATT_NUMBER)return;
var link=document.getElementById('smslink');
var pretty="+1 "+MATT_NUMBER.slice(2,5)+"-"+MATT_NUMBER.slice(5,8)+"-"+MATT_NUMBER.slice(8);
// "?&" form is the documented cross-client parse for iOS and Android Messages
link.href="sms:"+MATT_NUMBER+"?&body="+encodeURIComponent("Hi");
link.style.opacity="1";
document.getElementById('tfnum').textContent="Opens your texting app. Or text "+pretty+" yourself.";
})();
</script>
</body></html>
