<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet - BreakerOps</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#ffffff; --ink:#1d1d1f; --gray:#6e6e73; --line:#e8e8ed; --blue:#007aff; --soft:#f5f5f7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1c1e; --ink:#f5f5f7; --gray:#98989d; --line:#38383a; --blue:#0a84ff; --soft:#2c2c2e; }
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg); color:var(--ink);
  max-width:560px; margin:0 auto; padding:48px 24px 80px;
  font-size:17px; line-height:1.5;
}
h1{font-size:15px;font-weight:600;color:var(--gray);margin:0 0 40px;letter-spacing:.02em}
.hero{margin:0 0 8px}
.hero .amount{font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.hero .sub{color:var(--gray);font-size:15px;margin-top:6px}
button.sub{display:block;padding:0;cursor:pointer;text-align:left}
section{margin:44px 0}
h2{font-size:13px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .what{display:block}
.row .meta{color:var(--gray);font-size:14px;margin-top:2px;display:block}
button{
  font:inherit;font-size:15px;color:var(--blue);background:none;border:0;padding:0;
  cursor:pointer;margin-right:18px;margin-top:8px;
}
button.primary{
  background:var(--blue);color:#fff;border-radius:980px;padding:8px 18px;margin-top:8px;
}
details{border-top:1px solid var(--line);padding:0}
details summary{
  padding:16px 0;cursor:pointer;font-size:16px;list-style:none;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;color:var(--gray)}
details[open] summary::after{content:"\2212"}
details .inner{padding:0 0 16px;color:var(--ink)}
input,select{
  font:inherit;font-size:15px;background:var(--soft);color:var(--ink);
  border:0;border-radius:10px;padding:9px 12px;margin:4px 6px 4px 0;
}
.foot{margin-top:64px;color:var(--gray);font-size:13px}
.quiet{color:var(--gray);font-size:15px}
</style>
</head>
<body>
<h1>Cabinet</h1>

<div class="hero" id="hero"></div>

<section id="needs"></section>
<section id="nudge"></section>

<details>
  <summary>The money in detail</summary>
  <div class="inner" id="money"></div>
</details>
<details>
  <summary>Jobs</summary>
  <div class="inner">
    <div id="jobs"></div>
    <div style="margin-top:14px">
      <input id="newjob" placeholder="New job title" size="16">
      <input id="newcust" placeholder="Customer" size="12">
      <button id="addjob">Add</button>
    </div>
  </div>
</details>
<details>
  <summary>Schedule</summary>
  <div class="inner">
    <div id="sched"></div>
    <div style="margin-top:14px">
      <select id="schedjob"></select>
      <input id="schedstart" type="datetime-local">
      <button id="addplan">Add to my plan</button>
    </div>
  </div>
</details>
<details>
  <summary>Warranty</summary>
  <div class="inner" id="warranty"></div>
</details>
<details>
  <summary>Record a quote</summary>
  <div class="inner">
    <span class="quiet">Fastest way: text it, like "quote Miller, $400" - it lands here on its own. Or use this form:</span><br>
    <select id="quotejob"></select>
    <input id="quoteamt" placeholder="Amount $" size="8" inputmode="decimal">
    <button id="addquote">Record</button>
  </div>
</details>

<p class="foot">Recorded from your texts. Nothing goes to customers from here. Exports download only to your device.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://euchkgnqxycqzgamucry.supabase.co';
const SB_KEY='sb_publishable_wDN_uKDfrxffFmqxKKOZXw_bMIlhHne';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=c=>c==null?'no price recorded':'$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const daysSince=t=>Math.floor((Date.now()-new Date(t))/864e5);
let STALL_DAYS=+(localStorage.getItem('stallDays')||28); // owner-set; F1408 documents 28 days

let d={}; // all loaded data
const jmap=()=>Object.fromEntries((d.jobs||[]).map(j=>[j.id,j.title]));
const cmap=()=>Object.fromEntries((d.custs||[]).map(c=>[c.id,c.name]));
const jobName=id=>jmap()[id]||cmap()[id]||'';

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='/login/';return;}
  await loadData();
}

async function loadData(){
  const q=async(t,s)=>{const r=await sb.from(t).select(s||'*');return r.data||[];};
  const [jobs,custs,invoices,pays,quotes,extras,queue,drafts,sched,warr]=await Promise.all([
    q('cabinet_jobs','id,title,status,customer_id'),
    q('cabinet_customers','id,name'),
    sb.from('cabinet_invoices').select('id,job_id,amount_cents,issued_at,due_at,state').order('due_at').then(r=>r.data||[]),
    q('payment_observations','id,invoice_id,amount_cents,source,note'),
    sb.from('cabinet_quotes').select('id,job_id,customer_id,amount_cents,state,quoted_at,nudge_count').order('quoted_at').then(r=>r.data||[]),
    sb.from('unbilled_extras').select('id,job_id,description,amount_cents,state,customer_authorization').order('created_at',{ascending:false}).then(r=>r.data||[]),
    sb.from('resolution_queue').select('id,question,options,status').eq('status','open').then(r=>r.data||[]),
    sb.from('outbound_drafts').select('id,kind,job_id,recipient,body,state,version').in('state',['draft','approved']).order('created_at',{ascending:false}).then(r=>r.data||[]),
    sb.from('schedule_proposals').select('id,job_id,proposed_start,proposed_end,state,created_by').neq('state','canceled').order('proposed_start').then(r=>r.data||[]),
    sb.from('warranty_records').select('id,job_id,item,installed_at,term_text,notes,state').order('installed_at',{ascending:false}).then(r=>r.data||[]),
  ]);
  d={jobs,custs,invoices,pays,quotes,extras,queue,drafts,sched,warr};
  const opts='<option value="">(no job)</option>'+jobs.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
  $('schedjob').innerHTML=opts;$('quotejob').innerHTML=opts;
  render();
}

function openInvoices(){return (d.invoices||[]).filter(i=>i.state==='open');}
function openQuotes(){return (d.quotes||[]).filter(x=>x.state==='open');}
function stalled(){return openQuotes().filter(x=>daysSince(x.quoted_at)>=STALL_DAYS&&x.nudge_count<1);}
function unbilled(){return (d.extras||[]).filter(e=>e.state!=='invoiced'&&e.state!=='voided');}

function render(){
  const open=openInvoices();
  const total=open.reduce((a,i)=>a+(i.amount_cents||0),0);
  $('hero').innerHTML = open.length
    ? `<div class="amount">${money(total)}</div><button class="sub" id="herojobs">owed to you across ${open.length} job${open.length>1?'s':''}</button>`
    : `<div class="amount">Nothing outstanding</div><div class="sub">No open invoices right now.</div>`;
  const hj=$('herojobs');
  if(hj){hj.onclick=()=>{const det=[...document.querySelectorAll('details')].find(x=>/Jobs/.test(x.querySelector('summary').textContent));if(det){det.open=true;det.scrollIntoView({behavior:'smooth'});}};}

  // The one section that asks for a decision
  const items=[];
  (d.queue||[]).forEach(x=>{
    const opts=(x.options||[]).map((o,i)=>`<button data-q="${x.id}" data-i="${i}">${esc(o.title||o.label||('option '+(i+1)))}</button>`).join('');
    items.push(`<div class="row"><span class="what">${(x.question==='which_job'||x.question==='which_of_these_jobs')?'One of your texts needs a job picked.':esc(x.question)}</span><span class="meta">Pick the job it belongs to.</span><span>${opts}</span></div>`);
  });
  (d.drafts||[]).filter(x=>x.state==='draft').forEach(x=>{
    items.push(`<div class="row"><span class="what">${esc(x.body)}</span><span class="meta">Draft ${esc(x.kind)} to ${esc(x.recipient)} - never sends by itself.</span><span><button class="primary" data-dact="approved" data-id="${x.id}" data-v="${x.version}">Approve these words</button><button data-dact="canceled" data-id="${x.id}">Not this</button></span></div>`);
  });
  $('needs').innerHTML = items.length
    ? `<h2>Needs your yes</h2>${items.join('')}`
    : '';
  $('needs').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>resolveQueue(b));
  $('needs').querySelectorAll('[data-dact]').forEach(b=>b.onclick=()=>draftAction(b));

  const st=stalled();
  $('nudge').innerHTML = `<h2>Worth a nudge</h2><span class="quiet">One reminder after ${STALL_DAYS} quiet days. <button id="stallcfg" style="margin:0;font-size:13px">change</button></span>`+(st.length?st.map(x=>`<div class="row"><span class="what">${esc(jobName(x.job_id)||'A customer')} - ${money(x.amount_cents)}</span><span class="meta">Quoted ${daysSince(x.quoted_at)} days ago, no answer yet.</span><span><button data-nact="nudge" data-id="${x.id}" data-n="${x.nudge_count}">Mark nudged</button></span></div>`).join(''):'');
  $('stallcfg').onclick=()=>{
    const v=prompt('Remind me about an unanswered quote after how many days?',String(STALL_DAYS));
    const n=parseInt(v,10);if(Number.isFinite(n)&&n>0&&n<365){STALL_DAYS=n;localStorage.setItem('stallDays',String(n));render();}
  };
  $('nudge').querySelectorAll('[data-nact]').forEach(b=>b.onclick=()=>quoteAction(b));

  // Money detail
  const payByInv={};(d.pays||[]).forEach(p=>{(payByInv[p.invoice_id]=payByInv[p.invoice_id]||[]).push(p);});
  let m='';
  if(open.length){m+=open.map(i=>{
    const days=i.due_at?daysSince(i.due_at):null;
    const obs=(payByInv[i.id]||[]).map(p=>`<span class="meta">Heard from you: ${money(p.amount_cents)}${p.note?' - '+esc(p.note):''}</span>`).join('');
    return `<div class="row"><span class="what">${esc(jobName(i.job_id)||'(no job)')} - ${money(i.amount_cents)}</span><span class="meta">${days!=null&&days>0?days+' days out':'not due yet'}</span>${obs}</div>`;
  }).join('');}
  const oq=openQuotes();
  if(oq.length){m+=oq.map(x=>`<div class="row"><span class="what">Quote: ${esc(jobName(x.job_id||x.customer_id)||'(no job)')} - ${money(x.amount_cents)}</span><span class="meta">${daysSince(x.quoted_at)} days old${x.nudge_count?', nudged '+x.nudge_count+'x':''}</span><span><button data-nact="nudge" data-id="${x.id}" data-n="${x.nudge_count}">Mark nudged</button><button data-nact="won" data-id="${x.id}">Won</button><button data-nact="lost" data-id="${x.id}">Lost</button></span></div>`).join('');}
  const ub=unbilled();
  if(ub.length){m+=ub.map(e=>{
    const next=e.state==='recorded'?'<button data-eact="priced" data-id="'+e.id+'">Priced</button>':e.state==='priced'?'<button data-eact="approved" data-id="'+e.id+'">Approve</button>':e.state==='approved'?'<button data-eact="invoiced" data-id="'+e.id+'">Billed</button>':'';
    return `<div class="row"><span class="what">${esc(e.description)} - ${money(e.amount_cents)}</span><span class="meta">${esc(jobName(e.job_id)||'job not picked yet')} - ${esc(e.state)}</span><span>${next}<button data-eact="voided" data-id="${e.id}">Void</button></span></div>`;
  }).join('');}
  $('money').innerHTML=m||'<span class="quiet">Nothing recorded yet.</span>';
  $('money').querySelectorAll('[data-nact]').forEach(b=>b.onclick=()=>quoteAction(b));
  $('money').querySelectorAll('[data-eact]').forEach(b=>b.onclick=()=>extraAction(b));

  // Jobs
  $('jobs').innerHTML=(d.jobs||[]).length?d.jobs.map(j=>
    `<div class="row"><span class="what">${esc(j.title)}</span><span class="meta">${esc(cmap()[j.customer_id]||'')} - ${esc(j.status)}</span><span><button data-export="${j.id}">Export folder</button></span></div>`
  ).join(''):'<span class="quiet">No jobs yet. Text us one.</span>';
  $('jobs').querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportJob(b.dataset.export));

  // Schedule
  const label={owner_plan:'your plan',proposed:'proposed to customer',customer_confirmed:'confirmed by customer',declined:'declined'};
  $('sched').innerHTML=(d.sched&&d.sched.length)?d.sched.map(x=>{
    const when=x.proposed_start?new Date(x.proposed_start).toLocaleString():'no time recorded';
    const next=x.state==='owner_plan'?'<button data-sact="proposed" data-id="'+x.id+'">Mark proposed</button>':x.state==='proposed'?'<button data-sact="customer_confirmed" data-id="'+x.id+'">Customer confirmed</button>':'';
    return `<div class="row"><span class="what">${esc(jobName(x.job_id)||'')} - ${esc(when)}</span><span class="meta">${esc(label[x.state]||x.state)}</span><span>${next}<button data-sact="declined" data-id="${x.id}">Declined</button></span></div>`;
  }).join(''):'<span class="quiet">Nothing scheduled.</span>';
  $('sched').querySelectorAll('[data-sact]').forEach(b=>b.onclick=()=>schedAction(b));

  // Warranty
  $('warranty').innerHTML=(d.warr&&d.warr.length)?d.warr.map(w=>
    `<div class="row"><span class="what">${esc(w.item)} - ${esc(jobName(w.job_id)||'')}</span><span class="meta">installed ${esc(w.installed_at||'date not recorded')} - ${esc(w.term_text||'term not recorded')} - ${esc(w.state)}</span><span>${w.state==='active'?`<button data-wact="claimed" data-id="${w.id}">Claimed</button><button data-wact="expired" data-id="${w.id}">Expired</button><button data-wact="void" data-id="${w.id}">Void</button>`:''}</span></div>`
  ).join(''):'<span class="quiet">None recorded.</span>';
  $('warranty').querySelectorAll('[data-wact]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from('warranty_records').update({state:b.dataset.wact,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);await loadData();});
}

async function quoteAction(b){
  b.disabled=true;
  if(b.dataset.nact==='nudge'){await sb.from('cabinet_quotes').update({nudge_count:+b.dataset.n+1,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);}
  else{await sb.from('cabinet_quotes').update({state:b.dataset.nact,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);}
  await loadData();
}
async function extraAction(b){
  b.disabled=true;
  await sb.from('unbilled_extras').update({state:b.dataset.eact,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);
  await loadData();
}
async function schedAction(b){
  b.disabled=true;
  await sb.from('schedule_proposals').update({state:b.dataset.sact,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);
  await loadData();
}
async function resolveQueue(b){
  b.disabled=true;
  const {data:rows}=await sb.from('resolution_queue').select('options').eq('id',b.dataset.q);
  const opt=(rows&&rows[0]&&rows[0].options||[])[+b.dataset.i]||null;
  await sb.from('resolution_queue').update({status:'resolved',resolution:{chosen:opt},resolved_at:new Date().toISOString()}).eq('id',b.dataset.q);
  await loadData();
}
async function draftAction(b){
  b.disabled=true;
  const upd=b.dataset.dact==='approved'
    ?{state:'approved',approved_version:+b.dataset.v,approved_by:(await sb.auth.getUser()).data.user.id,approved_at:new Date().toISOString(),updated_at:new Date().toISOString()}
    :{state:'canceled',updated_at:new Date().toISOString()};
  await sb.from('outbound_drafts').update(upd).eq('id',b.dataset.id);
  await loadData();
}
$('addjob').onclick=async()=>{
  const t=$('newjob').value.trim();if(!t)return;
  const cn=$('newcust').value.trim();let cid=null;
  const {data:mem}=await sb.from('business_members').select('business_id').limit(1).single();
  if(cn){const {data:c}=await sb.from('cabinet_customers').insert({name:cn,business_id:mem.business_id}).select('id');cid=c&&c[0]&&c[0].id;}
  await sb.from('cabinet_jobs').insert({title:t,customer_id:cid,business_id:mem.business_id});
  $('newjob').value='';$('newcust').value='';await loadData();
};
$('addplan').onclick=async()=>{
  const t=$('schedstart').value;if(!t)return;
  const {data:mem}=await sb.from('business_members').select('business_id').limit(1).single();
  await sb.from('schedule_proposals').insert({business_id:mem.business_id,job_id:$('schedjob').value||null,proposed_start:new Date(t).toISOString(),state:'owner_plan',created_by:'owner-cabinet-ui'});
  $('schedstart').value='';await loadData();
};
$('addquote').onclick=async()=>{
  const raw=$('quoteamt').value.trim();
  const cents=raw?Math.round(parseFloat(raw.replace(/[^0-9.]/g,''))*100):null;
  const {data:mem}=await sb.from('business_members').select('business_id').limit(1).single();
  await sb.from('cabinet_quotes').insert({business_id:mem.business_id,job_id:$('quotejob').value||null,amount_cents:Number.isFinite(cents)?cents:null,state:'open'});
  $('quoteamt').value='';await loadData();
};

async function exportJob(jobId){
  const [job,extras,invoices,quotes,warr,drafts,pays]=await Promise.all([
    sb.from('cabinet_jobs').select('*').eq('id',jobId),
    sb.from('unbilled_extras').select('*').eq('job_id',jobId),
    sb.from('cabinet_invoices').select('*').eq('job_id',jobId),
    sb.from('cabinet_quotes').select('*').eq('job_id',jobId),
    sb.from('warranty_records').select('*').eq('job_id',jobId),
    sb.from('outbound_drafts').select('*').eq('job_id',jobId),
    sb.from('payment_observations').select('*')]);
  const invIds=new Set((invoices.data||[]).map(i=>i.id));
  const refs=[...new Set([...(extras.data||[]),...(invoices.data||[]),...(quotes.data||[]),...(warr.data||[]),...(drafts.data||[])].map(r=>r.source_ref).filter(Boolean))];
  const {data:msgs}=refs.length?await sb.from('inbound_messages').select('*').in('id',refs):{data:[]};
  const folder={exported_at:new Date().toISOString(),job:(job.data||[])[0]||null,extras:extras.data||[],invoices:invoices.data||[],quotes:quotes.data||[],warranty:warr.data||[],drafts:drafts.data||[],source_messages:msgs||[],payment_observations:(pays.data||[]).filter(p=>invIds.has(p.invoice_id))};
  const counts={extras:folder.extras.length,invoices:folder.invoices.length,quotes:folder.quotes.length,warranty:folder.warranty.length,drafts:folder.drafts.length,source_messages:folder.source_messages.length,payment_observations:folder.payment_observations.length};
  const body1=JSON.stringify({...folder,manifest:{counts}},null,2);
  const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(body1)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const manifest={counts,content_sha256:hash,byte_size:body1.length,recorded_by:'owner-export-button',exported_at:folder.exported_at,note:'sha-256 over this file body with counts-only manifest; hash covers every record byte'};
  const out=JSON.stringify({...folder,manifest},null,2);
  const name=((folder.job&&folder.job.title)||'job').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));
  a.download=name+'-cabinet-export.json';a.click();URL.revokeObjectURL(a.href);
  try{if(folder.job&&folder.job.business_id){await sb.from('cabinet_exports').insert({business_id:folder.job.business_id,job_id:jobId,manifest});}}catch(e){}
}

init();
</script>
</body>
</html>
