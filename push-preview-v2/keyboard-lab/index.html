<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Keyboard comparison</title><style>body{font:17px system-ui;background:#14252e;color:#eef4f6;margin:0;padding:calc(20px + env(safe-area-inset-top)) 20px 30px}button{font:inherit;color:inherit;background:#234452;border:1px solid #577482;border-radius:12px;padding:10px;margin:4px}#field{margin:30px 0 12px}input,textarea,[contenteditable]{box-sizing:border-box;width:100%;font:24px system-ui;color:#eef4f6;background:none;border:1px solid #577482;border-radius:10px;padding:14px;min-height:65px}small{color:#b4c5ce}#result{white-space:pre-wrap;font-size:14px}h1{font-size:23px}</style><h1>Keyboard comparison</h1><p>Local test. Nothing is sent or saved.</p><nav><button data-v="input">A: Single input</button><button data-v="textarea">B: Textarea</button><button data-v="editable">C: Editable text</button><button data-v="search">D: Search input</button><button data-v="hack">E: Input-mode trial</button></nav><h2 id="title"></h2><small id="note"></small><div id="field"></div><button id="focus">Open keyboard</button><button id="close">Close keyboard</button><p id="result" role="status"></p><script>
const names={input:'A: Single input, no form',textarea:'B: One textarea, no form',editable:'C: Plain-text contenteditable',search:'D: Search input, no form',hack:'E: Experimental inputmode switch'};let variant='input';function choose(v){variant=v;document.getElementById('title').textContent=names[v];document.getElementById('note').textContent=v==='hack'?'Experimental. Keyboard may fail to open or flicker. Not recommended for release.':'Observe whether up/down/check remains, then type, select, paste and dismiss.';let e=document.createElement(v==='editable'?'div':v==='textarea'?'textarea':'input');e.id='editor';if(v==='editable'){e.setAttribute('contenteditable','plaintext-only');e.setAttribute('role','textbox');e.setAttribute('aria-multiline','true');}else if(v!=='textarea')e.type=v==='search'?'search':'text';e.setAttribute('aria-label','Test text');e.setAttribute('autocomplete','off');e.setAttribute('autocorrect','on');e.setAttribute('enterkeyhint','enter');e.setAttribute('inputmode','text');document.getElementById('field').replaceChildren(e);document.getElementById('result').textContent='Ready. No form and exactly one text editor.';e.addEventListener('input',()=>{document.getElementById('result').textContent='Text length: '+(e.value??e.textContent).length;});}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>choose(b.dataset.v));document.getElementById('focus').onclick=()=>{let e=document.getElementById('editor');if(variant==='hack'){e.inputMode='none';e.focus();setTimeout(()=>e.inputMode='text',100);}else e.focus();};document.getElementById('close').onclick=()=>document.getElementById('editor').blur();choose('input');
</script></html>
