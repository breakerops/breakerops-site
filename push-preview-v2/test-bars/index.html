<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar tint test</title><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#648ea9">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#648ea9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#22333c">
<style>
/* Same base structure as push-preview-v2 landing: gradient on html, transparent body */
:root{--glow:radial-gradient(ellipse at 92% 0%,#a9d3e3 0,transparent 52%);--grad:linear-gradient(168deg,#648ea9 0%,#b7cdd6 48%,#e6d9c7 100%);--bar-top:#648ea9;--bar-bottom:#e6d9c7}
html{background-image:var(--glow),var(--grad)}
body{margin:0;background:transparent;color:#1e2c36;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{max-width:340px;padding:30px 24px;text-align:center;background:rgba(255,255,255,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid #ffffff90;border-radius:26px;box-shadow:0 8px 30px #25394714;margin:16px}
h1{font-size:22px;letter-spacing:-0.02em;margin:0 0 10px}
p{color:#485661;font-size:14px;line-height:1.5;margin:0 0 14px}
.links{font-size:15px;line-height:2}
.links a{color:#1e4d63;font-weight:600}
/* iOS 26 Safari edge samplers: fixed, full-width, >=3px tall, within 4px of the edge */
.bar-top{position:fixed;top:0;left:0;width:100%;height:11px;background:var(--bar-top);z-index:9999;pointer-events:none;display:none}
.bar-bottom{position:fixed;bottom:0;left:0;width:100%;height:11px;background:var(--bar-bottom);z-index:9999;pointer-events:none;display:none}
html.v1 .bar-top,html.v1 .bar-bottom,html.v3 .bar-top,html.v3 .bar-bottom{display:block}
/* v2: solid sampled root color (hub.penpost.co structure) */
html.v2{background-color:var(--bar-bottom)}
html.v2 body{background-color:var(--bar-bottom);background-image:var(--glow),var(--grad)}
/* v3: solid root fallback AND per-edge strips */
html.v3{background-color:var(--bar-bottom)}
html.v3 body{background-color:var(--bar-bottom);background-image:var(--glow),var(--grad)}
</style>
</head><body>
<div class="bar-top"></div><div class="bar-bottom"></div>
<div class="card">
<h1>Bar tint test <span id="vn"></span></h1>
<p id="desc"></p>
<p>Check Safari's top status area and bottom toolbar: they should pick up the page colors (blue top, warm sand bottom), not solid white.</p>
<div class="links">
<a href="?v=0">v0 control (current structure)</a><br>
<a href="?v=1">v1 fixed edge strips</a><br>
<a href="?v=2">v2 solid root color</a><br>
<a href="?v=3">v3 strips + solid root</a>
</div>
</div>
<script>
var v=new URLSearchParams(location.search).get('v')||'0';
document.documentElement.classList.add('v'+v);
document.getElementById('vn').textContent='v'+v;
document.getElementById('desc').textContent={0:'Control: gradient on html, transparent body (what is live now).',1:'Fixed 11px full-width strips at top and bottom edges with the gradient end colors.',2:'Solid background-color on html and body under the gradient (hub.penpost.co structure).',3:'Both: solid root color plus per-edge strips (blue top, sand bottom).'}[v]||'';
</script>
</body></html>
