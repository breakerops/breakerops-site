window.addEventListener('hashchange',function(){if(user)route();});
function findItem(id){for(var i=0;i<items.length;i++)if(String(items[i].id)===String(id))return items[i];return null;}
function backFor(p){
 if(!p)return null;
 if(p.indexOf('day/')===0)return ['\u2039 Week','#week'];
 if(p.indexOf('item/')===0){var it=findItem(p.slice(5));return it?['\u2039 '+parseKey(it.due_date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),'#day/'+it.due_date]:['\u2039 Home','#'];}
 if(['logs','users','profile','integrations','thoughts'].indexOf(p)>=0)return ['\u2039 Settings','#settings'];
 return ['\u2039 Home','#'];
}
function route(){
 var p=location.hash.replace(/^#/,'');
 var bp=backFor(p),b=$('backpill');
 if(bp){b.hidden=false;b.textContent=bp[0];b.setAttribute('href',bp[1]);}else{b.hidden=true;}
 if(p==='')return renderHome();
 if(p==='week')return renderWeek();
 if(p.indexOf('day/')===0)return renderDay(p.slice(4));
 if(p.indexOf('item/')===0)return renderItem(p.slice(5));
 if(p.indexOf('area/')===0)return renderArea(p.slice(5));
 if(p==='summaries')return summaries();
 if(p==='settings')return settings();
 if(p==='logs')return logs();
 if(p==='users')return users();
 if(p==='profile')return profile();
 if(p==='integrations')return integrations();
 if(p==='thoughts')return thoughts();
 return renderHome();
}
function rowHtml(v){return '<button type="button" class="t-row" data-item="'+esc(v.id)+'">'+(v.due_time?'<span class="t-time">'+fmtTime(v.due_time)+'</span>':'')+'<span class="t-title">'+esc(v.title)+'</span><span class="chev" aria-hidden="true">&rsaquo;</span></button>';}
function todayAll(){var l=on(key(new Date()));return l.filter(function(v){return !v.due_time;}).concat(l.filter(function(v){return v.due_time;}));}
function renderHome(){
 var t=new Date();
 var acct=user?esc((user.user_metadata&&user.user_metadata.full_name)||user.email||''):'';
 var h='<h1 class="home-title">'+esc(bizName||'Your shop')+'</h1><p class="home-date">'+t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</p>'+(acct?'<p class="home-acct">'+acct+'</p>':'');
 h+='<p class="choose">Choose an area.</p><div class="tiles">'+['sales','operations','accounting'].map(function(a){var A=AREAS[a];return '<button type="button" class="tile" data-go="area/'+a+'">'+A.glyph+'<span class="t-label">'+A.label+'</span></button>';}).join('')+'</div>';
 var all=todayAll();
 h+='<section class="card"><div class="tc-head"><h2>Today</h2><a href="#week">View week &rsaquo;</a></div><p class="tc-date">'+t.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</p>';
 if(!all.length){h+='<p class="t-empty">Nothing planned.</p>';}
 else{
  h+=all.slice(0,3).map(rowHtml).join('');
  if(all.length>3)h+='<details class="more" id="today-more"><summary>Show '+(all.length-3)+' more event'+(all.length-3===1?'':'s')+'</summary>'+all.slice(3).map(rowHtml).join('')+'</details>';
 }
 h+='</section>';
 h+='<a class="glass-row" href="#summaries">Daily summaries<span aria-hidden="true">&rsaquo;</span></a>';
 if(!items.length)h+='<p class="hint">Text us something you promised. Once confirmed, it will show up here.</p>';
 $('stage').innerHTML=h;
 $('stage').querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go);};});
 $('stage').querySelectorAll('[data-item]').forEach(function(b){b.onclick=function(){go('item/'+b.dataset.item);};});
 var tm=$('today-more');if(tm){tm.open=todayMore;tm.addEventListener('toggle',function(){todayMore=tm.open;});}
}
function renderWeek(){
 var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow);
 var days=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
 var end=days[6],range;
 if(mon.getMonth()===end.getMonth())range=mon.toLocaleDateString('en-US',{month:'long',day:'numeric'})+'\u2013'+end.getDate();
 else range=mon.toLocaleDateString('en-US',{month:'long',day:'numeric'})+' \u2013 '+end.toLocaleDateString('en-US',{month:'long',day:'numeric'});
 var h='<h1 class="page-title">Your week</h1><p class="page-sub">'+range+'</p>';
 var tk=key(new Date());
 h+=days.map(function(d){
  var k=key(d),l=on(k),all=l.filter(function(v){return !v.due_time;}).concat(l.filter(function(v){return v.due_time;}));
  var inner='<div class="wl" style="font-weight:700">'+d.toLocaleDateString('en-US',{weekday:'long'})+'</div>';
  if(!all.length)inner+='<div class="wc-none">\u2014</div>';
  else{
   inner+=all.slice(0,2).map(function(v){return '<div class="wl">'+(v.due_time?'<span class="t">'+fmtTime(v.due_time)+' &middot; </span>':'')+esc(v.title)+'</div>';}).join('');
   if(all.length>2)inner+='<div class="wc-more">'+(all.length-2)+' more event'+(all.length-2===1?'':'s')+'</div>';
  }
  return '<button type="button" class="week-card" data-day="'+esc(k)+'"><span class="wc-date"><span class="wd">'+d.toLocaleDateString('en-US',{weekday:'short'})+'</span><span class="num">'+d.getDate()+'</span>'+(k===tk?'<span class="today-tag">Today</span>':'')+'</span><span class="wc-lines">'+inner+'</span><span class="chev" aria-hidden="true">&rsaquo;</span></button>';
 }).join('');
 $('stage').innerHTML=h;
 $('stage').querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){go('day/'+b.dataset.day);};});
}
function agendaRow(v){return '<div class="agenda-item"><button type="button" class="agenda-head" data-expand="'+v.id+'" aria-expanded="'+(expanded[v.id]?'true':'false')+'">'+completionMark(v)+(v.due_time?'<span class="item-time">'+fmtTime(v.due_time)+'</span>':'')+'<span class="agenda-title">'+esc(v.title)+'</span></button>'+(expanded[v.id]&&v.notes?'<div class="agenda-notes">'+displayNotes(v.notes)+'</div>':'')+'</div>';}
function renderDay(k){
 var d=parseKey(k);if(isNaN(d))return renderHome();
 var l=on(k),un=l.filter(function(v){return !v.due_time;}),ti=l.filter(function(v){return v.due_time;});
 var h='<h1 class="page-title">'+(k===key(new Date())?'Today &middot; ':'')+d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</h1>';
 if(!l.length)h+='<p class="t-empty">Nothing planned.</p>';
 if(un.length)h+='<p class="sec-label">Anytime</p>'+un.map(agendaRow).join('');
 if(ti.length)h+='<p class="sec-label">Scheduled</p>'+ti.map(agendaRow).join('');
 h+='<p class="fine" style="margin-top:16px">Tap an item for its notes. Need to change something? Text us.</p>';
 $('stage').innerHTML=h;
 $('stage').querySelectorAll('[data-expand]').forEach(function(b){b.onclick=function(){expanded[b.dataset.expand]=!expanded[b.dataset.expand];renderDay(k);};});
}
function renderItem(id){
 var v=findItem(id);if(!v)return renderHome();
 var d=parseKey(v.due_date);
 var meta=(v.due_date===key(new Date())?'Today':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}))+' &middot; '+(v.due_time?fmtTime(v.due_time):'Anytime');
 var h='<h1 class="page-title">'+esc(v.title)+'</h1><p class="page-sub">'+meta+'</p>';
 if(v.completed)h+='<p><span class="done-chip"><svg class="drawn-check" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>Done</span></p>';
 h+='<div class="card">'+(v.notes?'<div>'+displayNotes(v.notes)+'</div>':'<p class="fine" style="margin:0">No notes.</p>')+'</div>';
 h+='<p class="fine">Need to change something? Text us.</p><p class="fine">'+textUs()+'</p>';
 $('stage').innerHTML=h;
}
function renderArea(a){
 if(!Object.prototype.hasOwnProperty.call(AREAS,a))return renderHome();var A=AREAS[a];
 var h='<h1 class="page-title">'+A.label+'</h1><p class="page-sub">'+A.sub+'</p>';
 h+='<div style="margin:10px 0 20px">'+A.glyph.replace('icon glyph','icon glyph glyph-lg')+'</div>';
 h+='<div class="card"><p class="t-empty">Nothing here yet.</p><p class="fine" style="margin:0">When something comes up in '+A.label.toLowerCase()+', it will show up on this page.</p></div>';
 h+='<p class="fine">Need to change something? Text us.</p><p class="fine">'+textUs()+'</p>';
 $('stage').innerHTML=h;
}
function markChosen(){
 var p=$('sw-p'),s=$('sw-s');
 if(p)p.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('chosen',b.dataset.color===boColors.p);});
 if(s)s.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('chosen',b.dataset.color===boColors.s);});
}
function buildSwatches(elId,colors,kind){
 var box=$(elId);if(!box)return;
 box.innerHTML=colors.map(function(c){return '<button type="button" class="sw" data-color="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>';}).join('');
 box.querySelectorAll('.sw').forEach(function(b){b.onclick=function(){
  var p=kind==='p'?b.dataset.color:boColors.p,s=kind==='s'?b.dataset.color:boColors.s;
  applyBoColors(p,s);markChosen();
  var st=$('sw-status');st.textContent='Saving\u2026';
  sb.auth.updateUser({data:Object.assign({},user&&user.user_metadata,{colors:{p:p,s:s}})}).then(function(r){st.textContent=(r&&r.error)?'Could not save. Try again.':'Saved to your account.';});
 };});
 markChosen();
}
function settings(){
 var h='<h1 class="page-title">Settings</h1><p class="page-sub">Your colors and account.</p>';
 h+='<div class="swatch-sec"><h3>Primary</h3><div class="sws" id="sw-p"></div></div>';
 h+='<div class="swatch-sec"><h3>Secondary</h3><div class="sws" id="sw-s"></div></div>';
 h+='<p class="sw-status" id="sw-status" role="status"></p>';
 h+='<div class="set-group"><a class="settings-row" href="#logs">Information logs<span aria-hidden="true">&rsaquo;</span></a><a class="settings-row" href="#users">Add users<span aria-hidden="true">&rsaquo;</span></a><a class="settings-row" href="#profile">Profile<span aria-hidden="true">&rsaquo;</span></a><a class="settings-row" href="#integrations">Integrations<span aria-hidden="true">&rsaquo;</span></a><a class="settings-row" href="#thoughts">Thoughts<span aria-hidden="true">&rsaquo;</span></a></div>';
 h+='<button class="signout" type="button" id="so">Sign out</button>';
 $('stage').innerHTML=h;
 buildSwatches('sw-p',BO_PRIMARY,'p');buildSwatches('sw-s',BO_SECONDARY,'s');
 $('so').onclick=signOut;
}
function noteDate(v){var d=new Date(v);return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function cleanNote(v){return String(v||'').replace(/\s*\(test\)/gi,'').replace(/Recorded from the current customer test conversation\.?/gi,'').trim();}
function logs(){
 $('stage').innerHTML='<h1 class="page-title">Information logs</h1><p class="fine">What we know about your business, from what you have told us.</p><p class="fine">Something wrong? Text us to confirm, change or remove an entry.</p><p class="fine">'+textUs()+'</p><div id="lg"><p class="fine">Loading\u2026</p></div>';
 sb.from('info_notes').select('id,title,body,status,updated_at').order('updated_at',{ascending:false}).then(function(q){var l=(q.data||[]);var box=$('lg');if(!box)return;
  box.innerHTML=(q.error||!l.length)?'<p class="fine">Nothing here yet. We add what you tell us about your business as we go.</p>':l.map(function(x){return '<div class="note"><b>'+esc(cleanNote(x.title))+'</b><div>'+esc(cleanNote(x.body)).replace(/\n/g,'<br>')+'</div><small>Updated '+esc(noteDate(x.updated_at))+'</small></div>';}).join('');});
}
function users(){
 $('stage').innerHTML='<h1 class="page-title">Add users</h1><div class="price"><b>$20/month per user</b></div><p>Text us their name and number and we will set them up.</p><p class="fine">We will confirm with you before adding anyone. Billing is not live yet. Payment is not collected on this page.</p><p class="fine">'+textUs()+'</p>';
}
function integrations(){
 $('stage').innerHTML='<h1 class="page-title">Integrations</h1><p class="page-sub">Optional connections.</p><div class="set-group"><div class="settings-row">Google Calendar<small>Not available yet</small></div><div class="settings-row">Outlook<small>Not available yet</small></div><div class="settings-row">Slack<small>Not available yet</small></div></div><p class="fine">We only read what you allow.</p>';
}
function profile(){
 var n=(user.user_metadata&&user.user_metadata.full_name)||'';
 $('stage').innerHTML='<h1 class="page-title">Profile</h1><label>Email</label><p style="margin:2px 0 12px">'+esc(user.email)+'</p><label>Name</label><p class="profile-name">'+esc(n||'Not set')+'</p><p class="fine">Text us to change.</p><h2>Change password</h2><label for="pc">Current password</label><input id="pc" type="password" autocomplete="current-password"><label for="p1">New password (at least 10 characters)</label><input id="p1" type="password" autocomplete="new-password"><label for="p2">Repeat new password</label><input id="p2" type="password" autocomplete="new-password"><button class="btn" id="sp">Save password</button><p class="msg" id="pm"></p>';
 var appearance=document.createElement('div');appearance.className='appearance';appearance.innerHTML='<label for="appearance">Appearance</label><select id="appearance"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (follow device)</option></select><p class="fine" id="appearance-status" role="status">Saved on this device only.</p>';
 var contact=document.createElement('p');contact.className='fine';contact.innerHTML=textUs();
 var stage=$('stage');stage.insertBefore(contact,stage.querySelector('h2'));stage.insertBefore(appearance,stage.querySelector('h2'));
 $('appearance').value=breakerAppearance.get();$('appearance').onchange=function(){breakerAppearance.set(this.value);$('appearance-status').textContent='Appearance saved on this device.';};
 $('sp').onclick=function(){var a=$('p1').value,b=$('p2').value,c=$('pc').value,m=$('pm');m.className='msg bad';if(!c){m.textContent='Enter your current password.';return;}if(a.length<10){m.textContent='Use at least 10 characters.';return;}if(a!==b){m.textContent='The two passwords do not match.';return;}
  sb.auth.updateUser({password:a,current_password:c}).then(function(r){if(r.error){m.textContent=r.error.message||'Could not save. Try again.';}else{m.className='msg ok';m.textContent='Password saved.';$('pc').value='';$('p1').value='';$('p2').value='';}});};
}
var thoughtRows=[];
async function loadThoughts(){var q=await sb.from('business_thoughts').select('id,business_id,topic_key,title,body,evidence,evidence_count,created_at').order('created_at',{ascending:false}).limit(3);if(q.error){thoughtRows=[];return false;}thoughtRows=q.data||[];return true;}
async function thoughts(){
 $('stage').innerHTML='<h1 class="page-title">Thoughts</h1><div id="thought-content" aria-live="polite"><p class="fine">Loading\u2026</p></div>';
 var ok=await loadThoughts();var box=$('thought-content');if(!box)return;
 if(!ok){box.innerHTML='<p class="fine">Could not load Thoughts. Please try again.</p>';return;}
 if(!thoughtRows.length){box.innerHTML='<div class="thought-empty">Nothing new today.<p>If something&#39;s worth a thought, it&#39;ll show up here.</p><p>'+textUs()+'</p></div>';return;}
 box.innerHTML='<p class="fine">Things we noticed from what you have shared. Never more than three.</p>';
 thoughtRows.forEach(function(t){var card=document.createElement('article');card.className='thought';var h=document.createElement('h2');h.textContent=t.title;card.appendChild(h);var p=document.createElement('p');p.textContent=t.body;card.appendChild(p);var d=document.createElement('details'),sm=document.createElement('summary');sm.textContent='What this is based on';d.appendChild(sm);var ev=document.createElement('div');ev.className='evidence';ev.textContent=(t.evidence||[]).join('\n');d.appendChild(ev);card.appendChild(d);var acts=document.createElement('div');acts.className='thought-actions';var state=document.createElement('p');state.className='fine';state.setAttribute('role','status');['like','no'].forEach(function(v){var btn=document.createElement('button');btn.textContent=v==='like'?'I like it':'No';btn.setAttribute('aria-pressed','false');btn.onclick=async function(){acts.querySelectorAll('button').forEach(function(b){b.disabled=true;});var r=await sb.from('thought_feedback').upsert({business_id:t.business_id,topic_key:t.topic_key,verdict:v,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'business_id,topic_key'});acts.querySelectorAll('button').forEach(function(b){b.disabled=false;});if(r.error){state.textContent='Could not save. Please try again.';return;}acts.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===btn?'true':'false');});state.textContent=v==='like'?'Saved.':'Saved. We will leave this topic alone.';if(v==='no'){thoughtRows=thoughtRows.filter(function(x){return x.topic_key!==t.topic_key;});}};acts.appendChild(btn);});card.appendChild(acts);card.appendChild(state);box.appendChild(card);
 sb.from('thought_feedback').select('verdict').eq('business_id',t.business_id).eq('topic_key',t.topic_key).maybeSingle().then(function(r){if(r.data)acts.querySelectorAll('button').forEach(function(b,i){b.setAttribute('aria-pressed',(i===0&&r.data.verdict==='like')?'true':'false');});});});
 var foot=document.createElement('p');foot.className='thought-foot';foot.textContent="Your answer helps us learn what's useful to you.";box.appendChild(foot);
}
var SUMMARY_DATA={},sumCur=new Date();sumCur.setHours(0,0,0,0);
function summaryFor(k){return SUMMARY_DATA[k]||null;}
function renderSummaryPanel(){
 var el=$('sum-panel');if(!el)return;
 var sm=$('smt');if(sm)sm.textContent=sumDayLabel();
 var k=key(sumCur),d=summaryFor(k);
 var today=key(new Date()),fut=k>today;
 var h='';
 var talked=(d&&d.talked)||[],tho=(d&&d.thoughts)||[],sum=(d&&d.summary)||[];
 if(sum.length){h+='<div class="sum-seg">'+sum.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>';}
 else if(talked.length){h+='<div class="sum-seg"><h3>'+(fut?'From your conversations':'Talked about')+'</h3>'+talked.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>';}
 else if(fut){h='<p class="sum-empty">'+(on(k).length?'Planned items are on the calendar.':'Nothing planned yet.')+'</p>';}
 else{h='<p class="sum-empty">'+(k===today?'Nothing to recap yet.':'Nothing recorded for this day.')+'</p>';}
 if(tho.length){h+='<div class="sum-seg"><h3>Thoughts</h3>'+tho.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>';}
 el.innerHTML=h;
}
function sumDayLabel(){var k=key(sumCur);return (k===key(new Date())?'Today \u00b7 ':'')+sumCur.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function summaries(){
 $('stage').innerHTML='<h1 class="page-title">Daily summaries</h1><div class="nav"><button id="spv" aria-label="Previous day">&lt;</button><b id="smt"></b><button id="snx" aria-label="Next day">&gt;</button></div><div class="sum-panel" id="sum-panel" aria-live="polite"></div>';
 $('spv').onclick=function(){sumCur.setDate(sumCur.getDate()-1);renderSummaryPanel();};
 $('snx').onclick=function(){sumCur.setDate(sumCur.getDate()+1);renderSummaryPanel();};
 renderSummaryPanel();
 sb.from('daily_summaries').select('date,sections').order('date',{ascending:false}).limit(90).then(function(q){(q.data||[]).forEach(function(r){SUMMARY_DATA[r.date]=r.sections;});renderSummaryPanel();});
}
function signOut(){try{localStorage.removeItem('bo-colors')}catch(e){}sb.auth.signOut().then(function(){location.replace('/push-preview-v2/');});}
function refresh(){return sb.from('calendar_items').select('id,title,due_date,due_time,notes,completed').order('due_date').then(function(q){items=q.data||[];route();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&user)refresh();});
setInterval(function(){if(!document.hidden&&user)refresh();},60000);
$('gear').onclick=function(){go('settings');};
$('textus-btn').addEventListener('click',function(){var b=$('textus-pop');b.hidden=!b.hidden;if(!b.hidden)b.innerHTML=textUs();});
document.addEventListener('click',function(e){var p=$('textus-pop');if(p&&!p.hidden&&!p.contains(e.target)&&e.target.id!=='textus-btn')p.hidden=true;});
sb.auth.getSession().then(function(r){
 if(!r.data.session){location.replace('/push-preview-v2/');return;}
 user=r.data.session.user;
 var __bc=user.user_metadata&&user.user_metadata.colors;if(__bc&&__bc.p)applyBoColors(__bc.p,__bc.s||'#648ea9');
 sb.from('businesses').select('name').limit(1).then(function(q){var n=q.data&&q.data[0]&&q.data[0].name;if(!n)n=(user.user_metadata&&user.user_metadata.company_name)||'';if(n){bizName=n;if(!location.hash.replace(/^#/,''))renderHome();}});
 route();
 refresh();
});
route();
</script></body></html>
