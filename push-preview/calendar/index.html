function cell(d){var k=key(d),l=on(k);return '<button type="button" data-day="'+k+'" class="day-cell'+(k===tk?' today':'')+(l.length?' has-events':'')+'" aria-label="'+esc(d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}))+', '+l.length+' '+(l.length===1?'item':'items')+'"><span class="d">'+d.getDate()+'</span>'+chips(k)+(l.length?'<span class="event-count">'+l.length+' '+(l.length===1?'item':'items')+'</span>':'')+'</button>';}
function openDay(k){dayOrigin={view:vw,date:new Date(cur)};cur=new Date(k+'T00:00:00');vw='w';render();$('calendar-back').focus();}
$('calendar-back').onclick=function(){if(!dayOrigin)return;var origin=dayOrigin;dayOrigin=null;vw=origin.view;cur=new Date(origin.date);render();};
$('cv').addEventListener('click',function(e){var x=e.target.closest('[data-expand]');if(x){expanded[x.dataset.expand]=!expanded[x.dataset.expand];render();return;}var b=e.target.closest('[data-day]');if(b){if(vw==='w'){dayOrigin=null;cur=new Date(b.dataset.day+'T00:00:00');render();}else openDay(b.dataset.day);}});
function render(){
 $('calendar-back').hidden=!dayOrigin;$('calendar-back').textContent=dayOrigin?'Back to my '+(dayOrigin.view==='w'?'week':'month'):'';Array.prototype.forEach.call($('sg').children,function(b){b.setAttribute('aria-pressed',b.dataset.v===vw?'true':'false');});
 $('text-contact').innerHTML=textUs();
 $('empty').hidden=items.length>0;var h='',y=cur.getFullYear(),mo=cur.getMonth();
 if(vw==='m'){
  $('mt').textContent=cur.toLocaleString('en-US',{month:'long',year:'numeric'});
  DN.forEach(function(d){h+='<div class="h">'+d+'</div>';});
  var first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=n;d++)h+=cell(new Date(y,mo,d));
  for(var j=first+n;j<42;j++)h+='<div></div>';
  $('cv').innerHTML='<div class="grid m">'+h+'</div>';
 }else if(vw==='w'){
  var s=new Date(cur);s.setDate(s.getDate()-s.getDay());var e=new Date(s);e.setDate(e.getDate()+6);
  $('mt').textContent=s.toLocaleString('en-US',{month:'short',day:'numeric'})+' - '+e.toLocaleString('en-US',{month:'short',day:'numeric'});
var ds=[];for(var i=0;i<7;i++){var x=new Date(s);x.setDate(s.getDate()+i);ds.push(x);}function stamp(x){return '<span class="wd">'+x.toLocaleDateString('en-US',{weekday:'short'})+'</span><span class="num">'+x.getDate()+'</span>';}function summary(){var selected=key(cur),l=on(selected);return '<div class="option-summary"><p class="choice-title">'+(selected===tk?'Today · ':'')+new Date(selected+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</p>'+l.map(function(v){return '<div class="agenda-item'+(v.completed?' completed':'')+'"><button type="button" class="agenda-head" data-expand="'+v.id+'" aria-expanded="'+(expanded[v.id]?'true':'false')+'">'+completionMark(v)+timeLabel(v)+'<span class="agenda-title">'+esc(v.title)+'</span></button>'+(expanded[v.id]&&v.notes?'<div class="agenda-notes">'+displayNotes(v.notes)+'</div>':'')+'</div>';}).join('')+(l.length?'':'<p class="fine">Nothing planned.</p>')+'</div>';}
h='<div class="week-choice"><div class="week-seven">'+ds.map(function(x){var k=key(x),l=on(k);return '<button data-day="'+k+'" class="'+(k===key(cur)?'today':'')+'">'+stamp(x)+'<span class="dot-row">'+l.slice(0,3).map(function(v){return '<i class="dot'+(v.completed?' done':'')+'"></i>';}).join('')+'</span><span class="tile-count">'+(l.length?(l.every(function(v){return v.completed;})?'<svg class="drawn-check" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg> ':l.filter(function(v){return v.completed;}).length+'/')+l.length:'—')+'</span></button>';}).join('')+'</div><p class="tap-hint">Tap a day to see its items. Tap an item for details.</p>'+summary()+'</div>';$('cv').innerHTML=h;
 }else{
  $('mt').textContent=cur.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric'});
  var l=on(key(cur));
  $('cv').innerHTML='<ul class="list dl">'+(l.length?l.map(function(x){return '<li class="'+(x.completed?'completed':'')+'"><div class="item-line">'+completionMark(x)+'<div class="item-copy">'+timeLabel(x)+'<b>'+esc(x.title)+'</b>'+(x.notes?'<small>'+displayNotes(x.notes)+'</small>':'')+'</div></div></li>';}).join(''):'<li class="fine">Nothing on this day. Text us something you promised. Once confirmed, it will show up here.</li>')+'</ul>';
 }
}
function step(n){if(vw==='m'){cur.setDate(1);cur.setMonth(cur.getMonth()+n);}else cur.setDate(cur.getDate()+7*n);render();}
$('pv').onclick=function(){step(-1);};$('nx').onclick=function(){step(1);};
Array.prototype.forEach.call($('sg').children,function(b){b.onclick=function(){dayOrigin=null;vw=b.dataset.v;Array.prototype.forEach.call($('sg').children,function(o){o.setAttribute('aria-pressed',o===b);});render();};});

document.addEventListener('click',function(e){if(!$('mm').contains(e.target)&&!$('mb').contains(e.target)){$('mm').hidden=true;$('mb').setAttribute('aria-expanded','false');}});
var user=null;
var CUSTOMER_TEXT_NUMBER='xxx-xxx-xxxx';
function textUs(){return 'Text us at '+CUSTOMER_TEXT_NUMBER+' <span class="fine">(number coming soon)</span>';}
function go(p){$('mm').hidden=true;location.hash=p;}
function route(){var p=location.hash.replace('#','');$('cal').hidden=!!p&&['logs','users','profile','summaries','settings','integrations'].indexOf(p)>=0;var pg=$('pg');
 if(['logs','users','profile','summaries','settings','integrations'].indexOf(p)<0){pg.hidden=true;$('cal').hidden=false;$('cal').style.display='flex';return;}
 $('cal').style.display='none';pg.hidden=false;
 if(p==='settings')settings();else if(p==='integrations')integrations();else if(p==='logs')logs();else if(p==='summaries')summaries();else if(p==='users')users();else profile();}
function noteDate(v){var d=new Date(v);return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function cleanNote(v){return String(v||'').replace(/\s*\(test\)/gi,'').replace(/Recorded from the current customer test conversation\.?/gi,'').trim();}
function logs(){var pg=$('pg');pg.innerHTML=back()+'<h1>Information logs</h1><p class="fine">What we know about your business, from what you have told us.</p><p class="fine">Something wrong? Text us to confirm, change or remove an entry.</p><div id="lg"><p class="fine">Loading...</p></div>';
 $('pg').querySelector('h1').insertAdjacentHTML('afterend','<p class="fine">'+textUs()+'</p>');
 sb.from('info_notes').select('id,title,body,status,updated_at').order('updated_at',{ascending:false}).then(function(q){var l=(q.data||[]);
  $('lg').innerHTML=(q.error||!l.length)?'<p>Nothing here yet. We add what you tell us about your business as we go.</p>':l.map(function(x){return '<div class="note"><b>'+esc(cleanNote(x.title))+'</b><div>'+esc(cleanNote(x.body)).replace(/\n/g,'<br>')+'</div><small>Updated '+esc(noteDate(x.updated_at))+'</small></div>';}).join('');});}
function back(){return '<a class="back-link" href="#settings">Back to settings</a>';}
function users(){var pg=$('pg');pg.innerHTML=back()+'<h1>Add users</h1><div class="price"><b>First account: $80/month</b><br><b>Each additional user: $60/month</b></div><p>Text us their name and number and we will set them up.</p><p class="fine">We will confirm with you before adding anyone. Billing is not live yet. Payment is not collected on this page.</p><p class="fine">'+textUs()+'</p>';}
function profile(){var pg=$('pg'),n=(user.user_metadata&&user.user_metadata.full_name)||'';
 pg.innerHTML=back()+'<h1>Profile</h1><label>Email</label><p style="margin:2px 0 12px">'+esc(user.email)+'</p><label>Name</label><p class="profile-name">'+esc(n||"Not set")+'</p><p class="fine">Text us to change.</p><h2 style="margin-top:18px">Change password</h2><label for="pc">Current password</label><input id="pc" type="password" autocomplete="current-password"><label for="p1">New password (at least 10 characters)</label><input id="p1" type="password" autocomplete="new-password"><label for="p2">Repeat new password</label><input id="p2" type="password" autocomplete="new-password"><button class="btn" id="sp">Save password</button><p class="msg" id="pm"></p>';
 var appearance=document.createElement('div');appearance.className='appearance';appearance.innerHTML='<label for="appearance">Appearance</label><select id="appearance"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (follow device)</option></select><p class="fine" id="appearance-status" role="status">Saved on this device only.</p>';
 var contact=document.createElement('p');contact.className='fine';contact.innerHTML=textUs();pg.insertBefore(contact,pg.querySelector('h2'));pg.insertBefore(appearance,pg.querySelector('h2'));$('appearance').value=breakerAppearance.get();$('appearance').onchange=function(){breakerAppearance.set(this.value);$('appearance-status').textContent='Appearance saved on this device.';};
 $('sp').onclick=function(){var a=$('p1').value,b=$('p2').value,c=$('pc').value,m=$('pm');m.className='msg bad';if(!c){m.textContent='Enter your current password.';return;}if(a.length<10){m.textContent='Use at least 10 characters.';return;}if(a!==b){m.textContent='The two passwords do not match.';return;}
  sb.auth.updateUser({password:a,current_password:c}).then(function(r){if(r.error){m.textContent=r.error.message||'Could not save. Try again.';}else{m.className='msg ok';m.textContent='Password saved.';$('pc').value='';$('p1').value='';$('p2').value='';}});};}
$('mb').onclick=function(e){e.stopPropagation();var h=$('mm').hidden;$('mm').hidden=!h;$('mb').setAttribute('aria-expanded',h);};
Array.prototype.forEach.call($('mm').querySelectorAll('[data-go]'),function(b){b.onclick=function(){go(b.dataset.go);};});
window.addEventListener('hashchange',function(){if(user)route();});


var thoughtRows=[];
function thoughtDot(){var b=$('mb'),old=b.querySelector('.thought-dot');if(old)old.remove();if(thoughtRows.length){var dot=document.createElement('span');dot.className='thought-dot';dot.setAttribute('aria-label','Thought available');b.appendChild(dot);}}
async function loadThoughts(){var q=await sb.from('business_thoughts').select('id,business_id,topic_key,title,body,evidence,evidence_count,created_at').order('created_at',{ascending:false}).limit(3);if(q.error){thoughtRows=[];thoughtDot();return false;}thoughtRows=q.data||[];thoughtDot();return true;}
async function thoughts(){var pg=$('pg');pg.innerHTML='<a class="back-link" href="#">Back to calendar</a><h1>Thoughts</h1><div id="thought-content" aria-live="polite"><p class="fine">Loading...</p></div>';
 var ok=await loadThoughts();if(!document.getElementById('thought-content'))return;var box=$('thought-content');if(!ok){box.innerHTML='<p>Could not load Thoughts. Please try again.</p>';return;}
 if(!thoughtRows.length){box.innerHTML='<div class="thought-empty">Nothing new today.<p>If something&#39;s worth a thought, it&#39;ll show up here.</p><p>'+textUs()+'</p></div>';return;}
 box.innerHTML='<p class="fine">Things we noticed from what you have shared. Never more than three.</p>';
 thoughtRows.forEach(function(t){var card=document.createElement('article');card.className='thought';var h=document.createElement('h2');h.textContent=t.title;card.appendChild(h);var p=document.createElement('p');p.textContent=t.body;card.appendChild(p);var d=document.createElement('details'),sm=document.createElement('summary');sm.textContent='What this is based on';d.appendChild(sm);var ev=document.createElement('div');ev.className='evidence';ev.textContent=(t.evidence||[]).join('\n');d.appendChild(ev);card.appendChild(d);var acts=document.createElement('div');acts.className='thought-actions';var state=document.createElement('p');state.className='fine';state.setAttribute('role','status');['like','no'].forEach(function(v){var btn=document.createElement('button');btn.textContent=v==='like'?'I like it':'No';btn.setAttribute('aria-pressed','false');btn.onclick=async function(){acts.querySelectorAll('button').forEach(function(b){b.disabled=true;});var r=await sb.from('thought_feedback').upsert({business_id:t.business_id,topic_key:t.topic_key,verdict:v,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'business_id,topic_key'});acts.querySelectorAll('button').forEach(function(b){b.disabled=false;});if(r.error){state.textContent='Could not save. Please try again.';return;}acts.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===btn?'true':'false');});state.textContent=v==='like'?'Saved.':'Saved. We will leave this topic alone.';if(v==='no'){thoughtRows=thoughtRows.filter(function(x){return x.topic_key!==t.topic_key;});thoughtDot();}};acts.appendChild(btn);});card.appendChild(acts);card.appendChild(state);box.appendChild(card);
 sb.from('thought_feedback').select('verdict').eq('business_id',t.business_id).eq('topic_key',t.topic_key).maybeSingle().then(function(r){if(r.data)acts.querySelectorAll('button').forEach(function(b,i){b.setAttribute('aria-pressed',(i===0&&r.data.verdict==='like')?'true':'false');});});});
 var foot=document.createElement('p');foot.className='thought-foot';foot.textContent="Your answer helps us learn what's useful to you.";box.appendChild(foot);}



var SUMMARY_DATA={},sumSel=key(new Date()),sumWeek=new Date();sumWeek.setHours(0,0,0,0);sumWeek.setDate(sumWeek.getDate()-sumWeek.getDay());
function summaryFor(k){return SUMMARY_DATA[k]||null;}
function renderSummaryPanel(){var el=$('sum-panel');if(!el)return;var d=summaryFor(sumSel);
 var head=(sumSel===key(new Date())?'Today \u00b7 ':'')+new Date(sumSel+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 var h='<h2>'+esc(head)+'</h2>';
 var talked=(d&&d.talked)||[],cal=(d&&d.calendar)||[],tho=(d&&d.thoughts)||[];
 if(!talked.length&&!cal.length&&!tho.length){el.innerHTML=h+'<p class="sum-empty">Nothing recorded for this day.</p>';return;}
 if(cal.length){h+='<div class="sum-seg"><h3>On the calendar</h3>'+cal.map(function(c){return '<p><span class="sum-time">'+esc(c[0])+'</span>'+esc(c[1])+'</p>';}).join('')+'<p class="sum-note">Scheduled, from your calendar.</p></div>';}
 if(talked.length){h+='<div class="sum-seg"><h3>Talked about</h3>'+talked.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>';}
 if(tho.length){h+='<div class="sum-seg"><h3>Thoughts</h3>'+tho.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>';}
 el.innerHTML=h;}
function renderSummaries(){var mt=$('smt'),strip=$('sum-week');if(!mt||!strip)return;
 var s=new Date(sumWeek),e=new Date(s);e.setDate(e.getDate()+6);
 mt.textContent=s.toLocaleString('en-US',{month:'short',day:'numeric'})+' - '+e.toLocaleDateString('en-US',{month:'short',day:'numeric'});
 var h='';for(var i=0;i<7;i++){var x=new Date(s);x.setDate(s.getDate()+i);var k=key(x);var has=!!summaryFor(k);
  h+='<button data-sumday="'+k+'" class="'+(k===sumSel?'today':'')+'"><span class="wd">'+x.toLocaleDateString('en-US',{weekday:'short'})+'</span><span class="num">'+x.getDate()+'</span><span class="dot-row">'+(has?'<i class="dot"></i>':'')+'</span></button>';}
 strip.innerHTML=h;renderSummaryPanel();}
function summaries(){$('pg').innerHTML='<a class="back-link" href="#">Back to calendar</a><h1>Summaries</h1><div class="nav"><button id="spv" aria-label="Previous week">&lt;</button><b id="smt"></b><button id="snx" aria-label="Next week">&gt;</button></div><div class="week-choice"><div class="week-seven" id="sum-week"></div><p class="tap-hint">Tap a day to see its summary.</p></div><div class="sum-panel" id="sum-panel" aria-live="polite"></div>';
 $('spv').onclick=function(){sumWeek.setDate(sumWeek.getDate()-7);renderSummaries();};
 $('snx').onclick=function(){sumWeek.setDate(sumWeek.getDate()+7);renderSummaries();};
 $('sum-week').addEventListener('click',function(e){var b=e.target.closest('[data-sumday]');if(b){sumSel=b.dataset.sumday;renderSummaries();}});
 renderSummaries();
 sb.from('daily_summaries').select('date,sections').order('date',{ascending:false}).limit(90).then(function(q){
  (q.data||[]).forEach(function(r){SUMMARY_DATA[r.date]=r.sections;});renderSummaries();});}

function settings(){ $('pg').innerHTML='<a class="back-link" href="#">Back to calendar</a><h1>Settings</h1><p class="settings-sub">Your account and connections.</p><div class="settings-group"><a class="settings-row" href="#logs">Information logs<span aria-hidden="true">&#8250;</span></a><a class="settings-row" href="#users">Add users<span aria-hidden="true">&#8250;</span></a><a class="settings-row" href="#profile">Profile<span aria-hidden="true">&#8250;</span></a></div><div class="settings-group"><a class="settings-row" href="#integrations">Integrations<span aria-hidden="true">&#8250;</span></a></div><button class="signout" type="button" onclick="signOut()">Sign out</button>'; }
function integrations(){ $('pg').innerHTML=back()+'<h1>Integrations</h1><p class="settings-sub">Optional connections.</p><div class="settings-group"><div class="settings-row">Google Calendar<small>Not available yet</small></div><div class="settings-row">Outlook<small>Not available yet</small></div><div class="settings-row">Slack<small>Not available yet</small></div></div><p class="fine">We only read what you allow.</p>'; }
function signOut(){sb.auth.signOut().then(function(){location.replace('/login/');});}
sb.auth.getSession().then(function(r){
 if(!r.data.session){location.replace('/login/');return;}
 user=r.data.session.user;route();
 sb.from('calendar_items').select('id,title,due_date,due_time,notes,completed').order('due_date').then(function(q){items=q.data||[];render();});
});
render();
</script></body></html>
