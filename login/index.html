<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | BreakerOps</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#111111">
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}a{color:#111}.wrap{max-width:720px;margin:0 auto;padding:0 22px}header{padding:20px 0}.hi{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.02em;text-decoration:none;font-size:20px}.brand span{font-weight:400}.btn{display:inline-block;background:#111;color:#fff;border:2px solid #111;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn:hover{background:#fff;color:#111}.btn.s{background:#fff;color:#111;padding:6px 14px;font-size:15px}.btn.s:hover{background:#111;color:#fff}.btn[disabled]{opacity:.45;cursor:default}.btn[disabled]:hover{background:#fff;color:#111}input{width:100%;font:inherit;padding:12px;border:2px solid #111;border-radius:10px;background:#fff;color:#111;margin:6px 0 14px}label{font-size:15px;font-weight:600}h1{font-size:30px;letter-spacing:-.02em;margin:20px 0 14px}h2{font-size:20px;margin:34px 0 8px}.fine{font-size:14px;color:#444}.msg{min-height:22px;font-size:15px}.msg.ok{display:block;border:2px solid #111;border-radius:10px;padding:14px;font-size:18px;font-weight:700;margin:14px 0}</style></head><body>
<header><div class="wrap hi"><a class="brand" href="/">Breaker<span>Ops</span></a></div></header>
<main><div class="wrap" style="max-width:420px">
<h1>Log in</h1>
<form id="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button class="btn" id="go" type="submit">Log in</button>
<p class="msg" id="m" role="status"></p>
<p class="fine" id="fgp"><a href="#" id="fg">Forgot password</a></p></form>
<p class="fine" style="margin-top:30px">Accounts are set up by us. Never send a password by text or email.</p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=supabase.createClient('https://euchkgnqxycqzgamucry.supabase.co','sb_publishable_wDN_uKDfrxffFmqxKKOZXw_bMIlhHne');
var m=document.getElementById('m'),em=document.getElementById('em');
sb.auth.getSession().then(function(r){if(r.data.session)location.replace('/app/');});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
 m.textContent='Checking...';
 sb.auth.signInWithPassword({email:em.value.trim(),password:document.getElementById('pw').value}).then(function(r){
  if(r.error){m.textContent='That email or password did not work.';return;}
  location.replace('/app/');});
});
document.getElementById('fg').addEventListener('click',function(e){e.preventDefault();
 if(!em.value.trim()){m.className='msg';m.textContent='Enter your email above first.';return;}
 var a=em.value.trim();m.className='msg';m.textContent='Sending...';
 sb.auth.resetPasswordForEmail(a,{redirectTo:'https://www.breakerops.com/reset/'}).then(function(){m.className='msg ok';m.textContent='Check your email. If '+a+' has an account, a link to set a new password is on its way. It can take a minute.';document.getElementById('fgp').textContent='Reset link sent.';m.scrollIntoView({block:'center'});});
});
</script></body></html>
